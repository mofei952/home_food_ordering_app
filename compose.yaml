services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: family_menu
      POSTGRES_USER: family_menu
      POSTGRES_PASSWORD: family_menu
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_menu"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql]
volumes:
  postgres_data:
