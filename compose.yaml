services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: family_menu
      POSTGRES_USER: family_menu
      POSTGRES_PASSWORD: family_menu
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_menu"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/family-menu
      "
    restart: "no"
  backend:
    build: ./backend
    environment:
      # Keep production-like settings, but local Compose serves plain HTTP on :8080.
      ENVIRONMENT: production
      SECURE_COOKIES: "false"
      TRUSTED_PROXY_HEADERS: "true"
      DATABASE_URL: postgresql+asyncpg://family_menu:family_menu@db:5432/family_menu
      IMAGE_STORAGE: s3
      # SDK talks to MinIO on the Docker network…
      S3_ENDPOINT_URL: http://minio:9000
      # …while signed URLs must use a host the browser can reach.
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: family-menu
      S3_REGION: us-east-1
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose: ["8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  frontend:
    build: ./frontend
    depends_on:
      - backend
    expose: ["80"]
  caddy:
    image: caddy:2.10-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
